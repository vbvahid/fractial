<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#2563eb"/>
  
  <!-- Fraction symbol: a/b with horizontal line -->
  <g transform="translate(256, 256)">
    <!-- Numerator "۱" (Persian digit 1) -->
    <text x="0" y="-55" text-anchor="middle" dominant-baseline="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="120" font-weight="700" fill="white">۱</text>
    
    <!-- Fraction bar -->
    <rect x="-80" y="-5" width="160" height="10" rx="5" fill="white"/>
    
    <!-- Denominator "۲" (Persian digit 2) -->
    <text x="0" y="75" text-anchor="middle" dominant-baseline="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="120" font-weight="700" fill="white">۲</text>
  </g>
</svg>